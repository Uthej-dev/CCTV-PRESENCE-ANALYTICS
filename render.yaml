# Render Blueprint for the API (Dashboard -> New -> Blueprint -> pick this repo).
# The frontend goes to Vercel; the database is MongoDB Atlas.
services:
  - type: web
    name: cctv-analytics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # PyTorch + YOLO need ~1 GB RAM: the 512 MB plans run out of memory.
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false            # paste your Atlas connection string in the dashboard
      - key: MONGODB_DB
        value: cctv_analytics
      - key: JWT_SECRET
        generateValue: true    # random secret generated by Render
      - key: CORS_ORIGINS
        sync: false            # e.g. https://your-app.vercel.app
      - key: YOLO_DEVICE
        value: cpu
      - key: PROCESS_FPS
        value: "8"
      - key: MAX_RUNNING_CAMERAS
        value: "2"
    disk:
      name: data
      mountPath: /app/data     # uploaded videos + recordings survive deploys
      sizeGB: 10
